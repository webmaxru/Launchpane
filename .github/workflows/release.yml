name: Standalone release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v1.2.1)
        required: true
        type: string

concurrency:
  group: standalone-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and synchronized versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const version = JSON.parse(readFileSync("package.json", "utf8")).version;
          const tauri = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const cargo = readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"$/m)?.[1];
          const lock = readFileSync("src-tauri/Cargo.lock", "utf8").match(/name = "launchpane"\nversion = "([^"]+)"/)?.[1];
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_TAG !== `v${version}`
              || [tauri, cargo, lock].some(value => value !== version)) {
            throw new Error("Release tag and app versions must match exactly.");
          }
          NODE
      - name: Check frontend
        run: pnpm lint && pnpm test && pnpm build
      - name: Check both backend editions
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test
          cargo clippy --features app-store -- -D warnings
          cargo test --features app-store

  build:
    needs: verify
    runs-on: macos-latest
    environment: macos-distribution
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin, universal-apple-darwin]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: "./src-tauri -> target"
      - name: Validate distribution credentials
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEVELOPER_ID_CERTIFICATE_BASE64" || { echo "::error::DEVELOPER_ID_CERTIFICATE_BASE64 is not configured in macos-distribution"; exit 1; }
          test -n "$DEVELOPER_ID_CERTIFICATE_PASSWORD" || { echo "::error::DEVELOPER_ID_CERTIFICATE_PASSWORD is not configured in macos-distribution"; exit 1; }
          test -n "$APPLE_SIGNING_IDENTITY" || { echo "::error::APPLE_SIGNING_IDENTITY is not configured in macos-distribution"; exit 1; }
          test -n "$APPLE_API_KEY" || { echo "::error::APPLE_API_KEY is not configured in macos-distribution"; exit 1; }
          test -n "$APPLE_API_ISSUER" || { echo "::error::APPLE_API_ISSUER is not configured in macos-distribution"; exit 1; }
          test -n "$APPLE_API_PRIVATE_KEY_BASE64" || { echo "::error::APPLE_API_PRIVATE_KEY_BASE64 is not configured in macos-distribution"; exit 1; }
          case "$APPLE_SIGNING_IDENTITY" in
            "Developer ID Application: "*) ;;
            *) echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity"; exit 1 ;;
          esac
      - run: pnpm install --frozen-lockfile
      - name: Import Developer ID certificate and notarization key
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/launchpane-distribution.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/launchpane-developer-id.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"

          {
            echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "APPLE_API_KEY_PATH=$API_KEY_PATH"
          } >> "$GITHUB_ENV"

          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
            grep -F "\"$APPLE_SIGNING_IDENTITY\"" >/dev/null; then
            echo "::error::The configured Developer ID identity was not found in the imported certificate"
            exit 1
          fi

      - name: Build standalone bundles and notarize the app
        env:
          TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm exec tauri build --target "$TARGET" --bundles app,dmg --ci
      - name: Sign, notarize, and staple the DMG container
        env:
          TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          images=(src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          test -f "${images[0]}"
          image="${images[0]}"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$image"
          result="$RUNNER_TEMP/dmg-notarization.json"
          xcrun notarytool submit "$image" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$result"
          if ! jq -e '.status == "Accepted"' "$result" >/dev/null; then
            cat "$result"
            echo "::error::Apple did not accept the DMG notarization submission"
            exit 1
          fi
          xcrun stapler staple "$image"
      - name: Verify signature and notarization, then package assets
        env:
          TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/package-standalone-release.ts "$TARGET" --require-notarization
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-${{ matrix.target }}
          path: release/github/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing credentials
        if: always()
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/launchpane-developer-id.p12"
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: standalone-*
          path: release
          merge-multiple: true
      - name: Verify complete payload and generate checksums
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for arch in aarch64 x64 universal; do
            test -s "release/Launchpane_${version}_${arch}.dmg"
            test -s "release/Launchpane_${arch}.app.tar.gz"
          done
          cd release
          sha256sum Launchpane_*.dmg Launchpane_*.app.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish only after every architecture succeeds
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Launchpane $RELEASE_TAG" --generate-notes \
            --notes "Standalone macOS release for Apple Silicon and Intel, including Universal builds. Apps are signed with Developer ID and notarized by Apple. Verify downloads against SHA256SUMS. App Store builds and credentials are not part of this release." \
            release/Launchpane_*.dmg release/Launchpane_*.app.tar.gz release/SHA256SUMS
          count="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')"
          test "$count" -eq 7
          gh release edit "$RELEASE_TAG" --draft=false --latest
