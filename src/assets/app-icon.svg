<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Concept 4 — Daemon Pulse (free-form, no plate)</title>
  <defs>
    <linearGradient id="c4frame" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#6E8BFF"/>
      <stop offset="50%" stop-color="#3D5BE0"/>
      <stop offset="100%" stop-color="#242A9E"/>
    </linearGradient>
    <linearGradient id="c4pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2BD39C"/>
      <stop offset="50%" stop-color="#7DF9D0"/>
      <stop offset="100%" stop-color="#FFD36B"/>
    </linearGradient>
    <filter id="c4shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1030" flood-opacity="0.30"/>
    </filter>
    <filter id="c4glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="c4gap">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <rect x="96" y="432" width="200" height="160" rx="40" fill="#000"/>
      <rect x="728" y="432" width="200" height="160" rx="40" fill="#000"/>
    </mask>
  </defs>

  <g filter="url(#c4shadow)" mask="url(#c4gap)">
    <rect x="186" y="186" width="652" height="652" rx="186" fill="none" stroke="url(#c4frame)" stroke-width="86"/>
  </g>

  <g>
    <circle cx="332" cy="356" r="34" fill="#9FB6FF"/>
    <circle cx="444" cy="356" r="34" fill="#9FB6FF" opacity="0.6"/>
    <circle cx="556" cy="356" r="34" fill="#9FB6FF" opacity="0.35"/>
  </g>

  <g filter="url(#c4glow)">
    <path d="M128 512 H330 l64 -150 l84 320 l70 -210 l54 40 H896"
          fill="none" stroke="url(#c4pulse)" stroke-width="56"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
