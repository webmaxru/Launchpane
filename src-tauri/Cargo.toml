[package]
name = "launchpane"
version = "1.3.4"
description = "A GUI for managing macOS launchd agents and daemons"
authors = ["Launchpane contributors"]
license = "MIT"
repository = "https://github.com/webmaxru/Launchpane"
edition = "2024"
rust-version = "1.85.0"

[features]
app-store = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[lib]
name = "launchpane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.10.0", features = [] }
plist = "1"
thiserror = "2"
dirs = "6"
libc = "0.2.182"
objc2 = { version = "0.6.3", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3"
