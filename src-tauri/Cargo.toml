[package]
name = "launchpane"
version = "1.2.1"
description = "A GUI for managing macOS launchd agents and daemons"
authors = ["Launchpane contributors", "azu"]
license = "MIT"
repository = "https://github.com/webmaxru/Launchpane"
edition = "2024"
rust-version = "1.85.0"

[features]
app-store = []

[lib]
name = "launchpane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.10.0", features = [] }
plist = "1"
thiserror = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"
