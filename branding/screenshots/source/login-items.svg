      <text x="208" y="452" font-size="14" font-weight="650" fill="#25262a">StartUpHelper</text><text x="208" y="475" font-size="12" fill="#82848e">com.spotify.client.StartupHelper</text><text x="690" y="464" font-size="13" fill="#35373e">Spotify</text><text x="917" y="464" font-size="13" fill="#35373e">Yes</text><rect x="1097" y="443" width="82" height="34" rx="9" fill="#4169df"/><text x="1138" y="465" text-anchor="middle" font-size="12" font-weight="600" fill="white">Disable</text>
