    <rect x="132" y="720" width="1176" height="60" rx="12" fill="#fff6e8" stroke="#f1d5ad"/><text x="158" y="746" font-family="-apple-system,sans-serif" font-size="13" font-weight="650" fill="#8a581c">Login items stay inside their parent applications.</text><text x="158" y="766" font-family="-apple-system,sans-serif" font-size="12" fill="#9c764a">Launchpane enables or disables them without modifying the app bundle.</text>
