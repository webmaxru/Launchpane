<!doctype html>

<style>

  }
  .trust i { color: rgba(255,255,255,.4); font-style: normal; }
  .shot {
    position: absolute; left: 628px; top: 122px; width: 700px;
    border: 1px solid rgba(255,255,255,.4); border-radius: 12px;

  <svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" aria-hidden="true">
